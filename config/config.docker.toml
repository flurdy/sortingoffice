# Minimal Sorting Office config for Docker/test builds

# Required aliases that must exist for all domains
required_aliases = [
    "postmaster",
    "abuse",
    "hostmaster"
]

# Common aliases that are typically useful
common_aliases = [
    "webmaster",
    "admin",
    "support"
]

# Database connection (use a test DB, can be overridden by env var)
[[databases]]
id = "primary"
label = "Test DB"
url = "${DATABASE_URL}"

# Connection pooling configuration for test environment
[databases.connection_pool]
max_size = 10                    # Smaller pool for testing
min_idle = 2                     # Fewer idle connections for testing
connection_timeout = 15          # Shorter timeout for testing
idle_timeout = 300               # Standard idle timeout
max_lifetime = 1800              # Standard max lifetime
test_on_acquire = true           # Test connections when acquiring
test_on_return = false           # Don't test when returning

# Admin user (overridable by env vars)
[[admins]]
# Username can be overridden by ADMIN_USERNAME env var
username = "admin"
# username = "${ADMIN_USERNAME}"
# Password hash for 'admin123', can be overridden by ADMIN_PASSWORD_HASH env var
password_hash = "$2a$12$o8thacsiGCRhN1JN8xnW6e0KqNb7KrSgM67xxa62RKoAC9fOPf.aO"
# password_hash = "${ADMIN_PASSWORD_HASH}"
role = "edit"

# Note: The app must support env var substitution in config for this to work. 

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <!-- Wizard Header -->
        <div class="mb-8">
            <div class="flex items-center mb-4">
                <div class="flex items-center justify-center w-8 h-8 bg-red-100 dark:bg-red-900/40 rounded-full mr-3">
                    <span class="text-sm font-semibold text-red-600 dark:text-red-400">1</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
            </div>
            <p class="text-gray-600 dark:text-gray-400">{{ description }}</p>
        </div>

        <!-- Warning Message -->
        <div class="mb-6 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-md p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-yellow-800 dark:text-yellow-200">{{ warning_message }}</p>
                </div>
            </div>
        </div>

        <!-- Error Message -->
        {% if error != "" %}
        <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-md p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-800 dark:text-red-200">{{ error }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Domain Selection Form -->
        <form method="POST" action="/remove-wizard/domain-selection" class="space-y-6">
            
            <!-- Domain Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {{ domain_label }}
                </label>
                <select name="domain_name" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 dark:bg-gray-700 dark:text-white">
                    <option value="">{{ domain_placeholder }}</option>
                    {% for domain in domain_names %}
                    <option value="{{ domain }}">{{ domain }}</option>
                    {% endfor %}
                </select>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ domain_description }}
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-end space-x-3">
                <a href="/domains" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ cancel_button }}
                </a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 rounded-md {% if current_db_read_only %}bg-gray-400 cursor-not-allowed{% else %}bg-red-600 hover:bg-red-700{% endif %}" {% if current_db_read_only %}disabled title="{{ read_only_tooltip }}"{% endif %}>
                    {% if current_db_read_only %}{{ read_only_database }}{% else %}{{ next_button }}{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>

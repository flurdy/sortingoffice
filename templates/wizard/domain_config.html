<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <!-- Wizard Header -->
        <div class="mb-8">
            <div class="flex items-center mb-4">
                <div class="flex items-center justify-center w-8 h-8 bg-blue-100 dark:bg-blue-900/40 rounded-full mr-3">
                    <span class="text-sm font-semibold text-blue-600 dark:text-blue-400">1</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
            </div>
            <p class="text-gray-600 dark:text-gray-400">{{ description }}</p>
        </div>

        <!-- Error Message -->
        {% if error != "" %}
        <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-md p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-800 dark:text-red-200">{{ error }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Domain Configuration Form -->
        <form method="POST" action="/wizard/domain-config" class="space-y-6">
            <!-- Domains Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {{ domains_label }}
                </label>
                <div id="domains-container" class="space-y-2">
                    <div class="flex items-center space-x-2">
                        <input
                            type="text"
                            class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                            placeholder="{{ domains_placeholder }}"
                            value="{{ form.domains }}"
                            required
                        />
                        <button type="button" id="add-domain-btn" onclick="addDomainField()" class="px-3 py-2 text-sm font-medium text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <input type="hidden" name="domains" id="domains-hidden" value="{{ form.domains }}" />
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ domains_description }}
                </p>
            </div>

            <script>
                // Initialize domain fields from existing data
                document.addEventListener('DOMContentLoaded', function() {
                    const firstInput = document.querySelector('#domains-container input[type="text"]');
                    if (firstInput && firstInput.value) {
                        // Split the comma-separated domains and create fields for each
                        const domains = firstInput.value.split(',').map(d => d.trim()).filter(d => d);
                        if (domains.length > 1) {
                            // Clear the first input and set it to the first domain
                            firstInput.value = domains[0];
                            
                            // Add fields for remaining domains
                            for (let i = 1; i < domains.length; i++) {
                                addDomainField();
                                // Find the newly created input field (the last one)
                                const allInputs = document.querySelectorAll('#domains-container input[type="text"]');
                                const newInput = allInputs[allInputs.length - 1];
                                if (newInput) {
                                    newInput.value = domains[i];
                                }
                            }
                        }
                    }
                });

                function addDomainField() {
                    const container = document.getElementById('domains-container');
                    const newField = document.createElement('div');
                    newField.className = 'flex items-center space-x-2';
                    newField.innerHTML = `
                        <input
                            type="text"
                            class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                            placeholder="{{ domains_placeholder }}"
                        />
                        <button type="button" class="remove-domain-btn px-3 py-2 text-sm font-medium text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300" onclick="removeDomainField(this)">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    `;
                    container.appendChild(newField);
                }

                function removeDomainField(button) {
                    button.parentElement.remove();
                }

                // Update hidden field before form submission
                document.querySelector('form').addEventListener('submit', function(e) {
                    // Prevent default submission to ensure our JavaScript runs
                    e.preventDefault();
                    
                    const inputs = document.querySelectorAll('#domains-container input[type="text"]');
                    const domains = Array.from(inputs)
                        .map(input => input.value.trim())
                        .filter(value => value.length > 0)
                        .join(', ');
                    document.getElementById('domains-hidden').value = domains;
                    
                    // Now submit the form
                    this.submit();
                });
                
                // Also update on input changes for real-time feedback
                document.addEventListener('input', function(e) {
                    if (e.target.closest('#domains-container')) {
                        const inputs = document.querySelectorAll('#domains-container input[type="text"]');
                        const domains = Array.from(inputs)
                            .map(input => input.value.trim())
                            .filter(value => value.length > 0)
                            .join(', ');
                        document.getElementById('domains-hidden').value = domains;
                    }
                });
            </script>



            <!-- Transport Input -->
            <div>
                <label for="transport" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {{ transport_label }}
                </label>
                <input
                    type="text"
                    id="transport"
                    name="transport"
                    value="{{ form.transport }}"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                    placeholder="{{ transport_placeholder }}"
                    required
                />
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ transport_description }}
                </p>
            </div>

            <!-- Enabled/Disabled Toggle -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {{ domain_status_label }}
                </label>
                <div class="radio-toggle-container">
                    <div class="radio-toggle">
                        <input type="radio" id="enabled_true" name="enabled" value="true" checked class="radio-toggle-input">
                        <label for="enabled_true" class="radio-toggle-label radio-toggle-label-left">
                            <span class="radio-toggle-icon">✓</span>
                            <span class="radio-toggle-text">{{ enabled_label }}</span>
                        </label>
                        
                        <input type="radio" id="enabled_false" name="enabled" value="false" class="radio-toggle-input">
                        <label for="enabled_false" class="radio-toggle-label radio-toggle-label-right">
                            <span class="radio-toggle-icon">✗</span>
                            <span class="radio-toggle-text">{{ disabled_label }}</span>
                        </label>
                        
                        <div class="radio-toggle-slider"></div>
                    </div>
                </div>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ enabled_description }}
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="flex justify-between pt-6">
                <a href="/wizard" class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                    {{ cancel_button }}
                </a>
                <button type="submit" id="wizard-submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                    {{ next_button }}
                    <svg class="ml-2 -mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

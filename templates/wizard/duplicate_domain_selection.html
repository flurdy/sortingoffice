<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <!-- Wizard Header -->
        <div class="mb-8">
            <div class="flex items-center mb-4">
                <div class="flex items-center justify-center w-8 h-8 bg-blue-100 dark:bg-blue-900/40 rounded-full mr-3">
                    <span class="text-sm font-semibold text-blue-600 dark:text-blue-400">1</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ title }}</h1>
            </div>
            <p class="text-gray-600 dark:text-gray-400">{{ description }}</p>
        </div>

        <!-- Error Message -->
        {% if error != "" %}
        <div class="mb-6 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-md p-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-800 dark:text-red-200">{{ error }}</p>
                </div>
            </div>
        </div>
        {% endif %}

        <!-- Domain Selection Form -->
        <form method="POST" action="/duplicate-wizard/domain-selection" class="space-y-6">
            
            <!-- Source Domain Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    {{ source_domain_label }}
                </label>
                <select name="source_domain" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                    <option value="">{{ source_domain_placeholder }}</option>
                    {% for domain in domains %}
                    <option value="{{ domain.domain }}">{{ domain.domain }}</option>
                    {% endfor %}
                </select>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                    {{ source_domain_description }}
                </p>
            </div>

            <!-- New Domain Configuration -->
            <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6">
                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">{{ new_domain_section_title }}</h3>
                
                <div class="space-y-4">
                    <!-- New Domain Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            {{ new_domain_label }}
                        </label>
                        <input 
                            type="text" 
                            name="new_domain" 
                            required 
                            placeholder="{{ new_domain_placeholder }}"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                        />
                        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                            {{ new_domain_description }}
                        </p>
                    </div>
                </div>
            </div>


            <!-- Action Buttons -->
            <div class="flex justify-end space-x-3">
                <a href="/domains" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ cancel_button }}
                </a>
                <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 rounded-md">
                    {{ next_button }}
                </button>
            </div>
        </form>
    </div>
</div>

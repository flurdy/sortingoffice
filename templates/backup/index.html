<div class="container mx-auto px-4 py-8" 
     data-please-select="{{ please_select }}"
     data-creating="{{ creating }}"
     data-session-expired="{{ session_expired }}"
     data-unexpected-response="{{ unexpected_response }}"
     data-failed-create="{{ failed_create }}"
     data-session-expired-load="{{ session_expired_load }}"
     data-failed-load="{{ failed_load }}"
     data-no-backups="{{ no_backups }}"
     data-failed-load-error="{{ failed_load_error }}"
     data-confirm-delete="{{ confirm_delete }}"
     data-session-expired-delete="{{ session_expired_delete }}"
     data-failed-delete="{{ failed_delete }}"
     data-failed-delete-error="{{ failed_delete_error }}"
     data-download-button="{{ download_button }}"
     data-action-download="{{ action_download }}"
     data-action-delete="{{ action_delete }}">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">
      {{ title }}
    </h1>

    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 mb-6">
      <p class="text-gray-600 dark:text-gray-300 mb-6">
        {{ description }}
      </p>

      <!-- Create Backup Section -->
      <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 mb-6">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
          {{ create_new_section }}
        </h2>
        
        {% if databases.is_empty() %}
        <p class="text-gray-500 dark:text-gray-400">
          {{ no_databases }}
        </p>
        {% else %}
        <form id="backup-form" class="space-y-4"
              hx-post="/backup/create-htmx"
              hx-target="#backup-status"
              hx-swap="innerHTML"
              hx-indicator="#backup-loading"
              hx-trigger="submit">
          <div>
            <label for="database-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              {{ database_select }}
            </label>
            <select id="database-select" name="database_id" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
              <option value="">{{ select_placeholder }}</option>
              {% for database in databases %}
              <option value="{{ database.id }}">{{ database.label }} ({{ database.id }})</option>
              {% endfor %}
            </select>
          </div>
          
          <button type="submit" id="create-backup-button"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            {{ create_button }}
          </button>
          
          <!-- HTMX Loading Indicator -->
          <div id="backup-loading" class="htmx-indicator">
            <div class="flex items-center space-x-2 text-blue-600">
              <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>{{ creating }}</span>
            </div>
          </div>
        </form>
        
        <div id="backup-status" class="mt-4">
          <!-- HTMX will replace this content -->
        </div>
        {% endif %}
      </div>

      <!-- Existing Backups Section -->
      <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
          {{ existing_section }}
        </h2>
        
        <div id="backups-list" class="space-y-2">
          <p class="text-gray-500 dark:text-gray-400">{{ loading }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Get translation values from data attributes
    const container = document.querySelector('.container');
    const translations = {
        pleaseSelect: container.getAttribute('data-please-select') || 'Please select a database.',
        creating: container.getAttribute('data-creating') || 'Creating backup...',
        sessionExpired: container.getAttribute('data-session-expired') || 'Session expired. Please refresh the page and try again.',
        unexpectedResponse: container.getAttribute('data-unexpected-response') || 'Unexpected response format. Please try again.',
        failedCreate: container.getAttribute('data-failed-create') || 'Failed to create backup: ',
        sessionExpiredLoad: container.getAttribute('data-session-expired-load') || 'Session expired. Please refresh the page.',
        failedLoad: container.getAttribute('data-failed-load') || 'Failed to load backups: Unexpected response format.',
        noBackups: container.getAttribute('data-no-backups') || 'No backups found.',
        failedLoadError: container.getAttribute('data-failed-load-error') || 'Failed to load backups: ',
        confirmDelete: container.getAttribute('data-confirm-delete') || 'Are you sure you want to delete this backup?',
        sessionExpiredDelete: container.getAttribute('data-session-expired-delete') || 'Session expired. Please refresh the page.',
        failedDelete: container.getAttribute('data-failed-delete') || 'Failed to delete backup: Unexpected response format.',
        failedDeleteError: container.getAttribute('data-failed-delete-error') || 'Failed to delete backup: ',
        downloadButton: container.getAttribute('data-download-button') || 'Download Backup',
        actionDownload: container.getAttribute('data-action-download') || 'Download',
        actionDelete: container.getAttribute('data-action-delete') || 'Delete'
    };

    const backupForm = document.getElementById('backup-form');
    const backupStatus = document.getElementById('backup-status');
    const backupSuccess = document.getElementById('backup-success');
    const backupError = document.getElementById('backup-error');
    const backupErrorMessage = document.getElementById('backup-error-message');
    const backupDownloadLink = document.getElementById('backup-download-link');
    const backupsList = document.getElementById('backups-list');

    // Load existing backups
    loadBackups();

    // Handle backup form submission
    if (backupForm) {
        // The HTMX attributes handle the submission and response handling
        // This script block is no longer needed for the form submission logic
    }

    function showSuccess(message, filename) {
        // This function is no longer needed as HTMX handles the status display
        // The HTMX target will replace the content of #backup-status
    }

    function showError(message) {
        // This function is no longer needed as HTMX handles the status display
        // The HTMX target will replace the content of #backup-status
    }

    async function loadBackups() {
        try {
            console.log('Loading backups...');
            const response = await fetch('/backup/list', {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin' // Important for maintaining session cookies
            });

            console.log('Load backups response status:', response.status);
            console.log('Load backups response headers:', Object.fromEntries(response.headers.entries()));

            // Check if response is JSON
            const contentType = response.headers.get('content-type');
            console.log('Load backups Content-Type:', contentType);
            
            if (!contentType || !contentType.includes('application/json')) {
                if (response.redirected || response.status === 302) {
                    console.log('Load backups response was redirected');
                    backupsList.innerHTML = '<p class="text-red-500">' + translations.sessionExpiredLoad + '</p>';
                    return;
                }
                const text = await response.text();
                console.log('Load backups non-JSON response:', text);
                backupsList.innerHTML = '<p class="text-red-500">' + translations.failedLoad + '</p>';
                return;
            }

            const backups = await response.json();
            console.log('Load backups JSON result:', backups);

            if (backups.length === 0) {
                backupsList.innerHTML = '<p class="text-gray-500 dark:text-gray-400">' + translations.noBackups + '</p>';
                return;
            }

            // Create table header
            const tableHeader = `
                <table class="w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-800">
                        <tr>
                                                            <th class="w-1/6 px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    {{ table_header_database }}
                                </th>
                                <th class="w-1/6 px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    {{ table_header_created }}
                                </th>
                                <th class="w-1/12 px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    {{ table_header_size }}
                                </th>
                                <th class="w-1/2 px-4 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    {{ table_header_filename }}
                                </th>
                                <th class="w-1/6 px-4 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    {{ table_header_actions }}
                                </th>
                        </tr>
                    </thead>
                    <tbody class="bg-white dark:bg-gray-900 divide-y divide-gray-200 dark:divide-gray-700">
            `;

            const tableRows = backups.map((backup, index) => {
                const isEven = index % 2 === 0;
                const rowClass = isEven ? 'bg-white dark:bg-gray-900' : 'bg-gray-50 dark:bg-gray-800';
                const createdDate = new Date(backup.created_at).toLocaleString();
                
                return `
                    <tr class="${rowClass} hover:bg-gray-100 dark:hover:bg-gray-700">
                        <td class="px-4 py-4">
                            <div class="text-sm font-medium text-gray-900 dark:text-white">${backup.database_name}</div>
                            <div class="text-sm text-gray-500 dark:text-gray-400">${backup.database_id}</div>
                        </td>
                        <td class="px-4 py-4 text-sm text-gray-900 dark:text-white">
                            ${createdDate}
                        </td>
                        <td class="px-4 py-4 text-sm text-gray-900 dark:text-white">
                            ${backup.size_formatted}
                        </td>
                        <td class="px-4 py-4 text-sm text-gray-500 dark:text-gray-400 font-mono break-all">
                            ${backup.filename}
                        </td>
                        <td class="px-4 py-4 text-right text-sm font-medium">
                            <div class="flex justify-end space-x-2">
                                <a href="/backup/download/${backup.filename}" 
                                   class="inline-flex items-center px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-md transition duration-200">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                    ${translations.actionDownload}
                                </a>
                                <button onclick="deleteBackup('${backup.filename}')" 
                                        class="inline-flex items-center px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md transition duration-200">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                    ${translations.actionDelete}
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            const tableFooter = `
                        </tbody>
                    </table>
            `;

            backupsList.innerHTML = tableHeader + tableRows + tableFooter;
        } catch (error) {
            console.error('Load backups error:', error);
            backupsList.innerHTML = '<p class="text-red-500">' + translations.failedLoadError + error.message + '</p>';
        }
    }



    // Make functions global
    window.loadBackups = loadBackups;
    window.deleteBackup = async function(filename) {
        if (!confirm(translations.confirmDelete)) {
            return;
        }

        try {
            const response = await fetch(`/backup/delete/${filename}`, {
                method: 'DELETE',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin' // Important for maintaining session cookies
            });

            // Check if response is JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                if (response.redirected || response.status === 302) {
                    alert(translations.sessionExpiredDelete);
                    return;
                }
                alert(translations.failedDelete);
                return;
            }

            const result = await response.json();
            if (result.success) {
                loadBackups(); // Refresh the backups list
            } else {
                alert(translations.failedDeleteError + result.message);
            }
        } catch (error) {
            console.error('Delete backup error:', error);
            alert(translations.failedDeleteError + error.message);
        }
    };
});
</script>

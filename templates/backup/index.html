<div class="container mx-auto px-4 py-8" 
     data-please-select="{{ please_select }}"
     data-creating="{{ creating }}"
     data-session-expired="{{ session_expired }}"
     data-unexpected-response="{{ unexpected_response }}"
     data-failed-create="{{ failed_create }}"
     data-session-expired-load="{{ session_expired_load }}"
     data-failed-load="{{ failed_load }}"
     data-no-backups="{{ no_backups }}"
     data-failed-load-error="{{ failed_load_error }}"
     data-confirm-delete="{{ confirm_delete }}"
     data-session-expired-delete="{{ session_expired_delete }}"
     data-failed-delete="{{ failed_delete }}"
     data-failed-delete-error="{{ failed_delete_error }}"
     data-download-button="{{ download_button }}">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">
      {{ title }}
    </h1>

    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 mb-6">
      <p class="text-gray-600 dark:text-gray-300 mb-6">
        {{ description }}
      </p>

      <!-- Create Backup Section -->
      <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 mb-6">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
          {{ create_new_section }}
        </h2>
        
        {% if databases.is_empty() %}
        <p class="text-gray-500 dark:text-gray-400">
          {{ no_databases }}
        </p>
        {% else %}
        <form id="backup-form" class="space-y-4">
          <div>
            <label for="database-select" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              {{ database_select }}
            </label>
            <select id="database-select" name="database_id" required
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
              <option value="">{{ select_placeholder }}</option>
              {% for database in databases %}
              <option value="{{ database.id }}">{{ database.label }} ({{ database.id }})</option>
              {% endfor %}
            </select>
          </div>
          
          <button type="submit" id="create-backup-button"
                  class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            {{ create_button }}
          </button>
        </form>
        
        <div id="backup-status" class="mt-4 hidden">
          <div id="backup-success" class="hidden p-4 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-md">
            <p class="text-green-800 dark:text-green-200">
              {{ status_success }}
            </p>
            <div id="backup-download-link" class="mt-2"></div>
          </div>
          <div id="backup-error" class="hidden p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-md">
            <p class="text-red-800 dark:text-red-200" id="backup-error-message">
              {{ status_error }}
            </p>
          </div>
        </div>
        {% endif %}
      </div>

      <!-- Existing Backups Section -->
      <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">
          {{ existing_section }}
        </h2>
        
        <div id="backups-list" class="space-y-2">
          <p class="text-gray-500 dark:text-gray-400">{{ loading }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Get translation values from data attributes
    const translations = {
        pleaseSelect: document.body.getAttribute('data-please-select') || 'Please select a database.',
        creating: document.body.getAttribute('data-creating') || 'Creating backup...',
        sessionExpired: document.body.getAttribute('data-session-expired') || 'Session expired. Please refresh the page and try again.',
        unexpectedResponse: document.body.getAttribute('data-unexpected-response') || 'Unexpected response format. Please try again.',
        failedCreate: document.body.getAttribute('data-failed-create') || 'Failed to create backup: ',
        sessionExpiredLoad: document.body.getAttribute('data-session-expired-load') || 'Session expired. Please refresh the page.',
        failedLoad: document.body.getAttribute('data-failed-load') || 'Failed to load backups: Unexpected response format.',
        noBackups: document.body.getAttribute('data-no-backups') || 'No backups found.',
        failedLoadError: document.body.getAttribute('data-failed-load-error') || 'Failed to load backups: ',
        confirmDelete: document.body.getAttribute('data-confirm-delete') || 'Are you sure you want to delete this backup?',
        sessionExpiredDelete: document.body.getAttribute('data-session-expired-delete') || 'Session expired. Please refresh the page.',
        failedDelete: document.body.getAttribute('data-failed-delete') || 'Failed to delete backup: Unexpected response format.',
        failedDeleteError: document.body.getAttribute('data-failed-delete-error') || 'Failed to delete backup: ',
        downloadButton: document.body.getAttribute('data-download-button') || 'Download Backup'
    };

    const backupForm = document.getElementById('backup-form');
    const backupStatus = document.getElementById('backup-status');
    const backupSuccess = document.getElementById('backup-success');
    const backupError = document.getElementById('backup-error');
    const backupErrorMessage = document.getElementById('backup-error-message');
    const backupDownloadLink = document.getElementById('backup-download-link');
    const backupsList = document.getElementById('backups-list');

    // Load existing backups
    loadBackups();

    // Handle backup form submission
    if (backupForm) {
        backupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(backupForm);
            const databaseId = formData.get('database_id');
            
            if (!databaseId) {
                showError(translations.pleaseSelect);
                return;
            }

            // Show loading state
            const submitButton = backupForm.querySelector('button[type="submit"]');
            const originalText = submitButton.textContent;
            submitButton.textContent = translations.creating;
            submitButton.disabled = true;

            try {
                console.log('Sending backup creation request...');
                const response = await fetch('/backup/create', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'same-origin' // Important for maintaining session cookies
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                console.log('Content-Type:', contentType);
                
                if (!contentType || !contentType.includes('application/json')) {
                    // If not JSON, it might be a redirect or HTML error
                    if (response.redirected || response.status === 302) {
                        console.log('Response was redirected');
                        showError(translations.sessionExpired);
                        return;
                    }
                    const text = await response.text();
                    console.log('Non-JSON response:', text);
                    showError(translations.unexpectedResponse);
                    return;
                }

                const result = await response.json();
                console.log('JSON result:', result);

                if (result.success) {
                    showSuccess(result.message, result.filename);
                    loadBackups(); // Refresh the backups list
                } else {
                    showError(result.message);
                }
            } catch (error) {
                console.error('Backup creation error:', error);
                showError(translations.failedCreate + error.message);
            } finally {
                submitButton.textContent = originalText;
                submitButton.disabled = false;
            }
        });
    }

    function showSuccess(message, filename) {
        backupStatus.classList.remove('hidden');
        backupSuccess.classList.remove('hidden');
        backupError.classList.add('hidden');
        
        if (filename) {
            backupDownloadLink.innerHTML = `
                <a href="/backup/download/${filename}" 
                   class="inline-flex items-center px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded-md transition duration-200">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    ${translations.downloadButton}
                </a>
            `;
        }
    }

    function showError(message) {
        backupStatus.classList.remove('hidden');
        backupSuccess.classList.add('hidden');
        backupError.classList.remove('hidden');
        backupErrorMessage.textContent = message;
    }

    async function loadBackups() {
        try {
            console.log('Loading backups...');
            const response = await fetch('/backup/list', {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin' // Important for maintaining session cookies
            });

            console.log('Load backups response status:', response.status);
            console.log('Load backups response headers:', Object.fromEntries(response.headers.entries()));

            // Check if response is JSON
            const contentType = response.headers.get('content-type');
            console.log('Load backups Content-Type:', contentType);
            
            if (!contentType || !contentType.includes('application/json')) {
                if (response.redirected || response.status === 302) {
                    console.log('Load backups response was redirected');
                    backupsList.innerHTML = '<p class="text-red-500">' + translations.sessionExpiredLoad + '</p>';
                    return;
                }
                const text = await response.text();
                console.log('Load backups non-JSON response:', text);
                backupsList.innerHTML = '<p class="text-red-500">' + translations.failedLoad + '</p>';
                return;
            }

            const backups = await response.json();
            console.log('Load backups JSON result:', backups);

            if (backups.length === 0) {
                backupsList.innerHTML = '<p class="text-gray-500 dark:text-gray-400">' + translations.noBackups + '</p>';
                return;
            }

            const backupsHtml = backups.map(backup => {
                const timestamp = extractTimestamp(backup);
                const size = ''; // Could be added later if needed
                
                return `
                    <div class="flex items-center justify-between p-3 border border-gray-200 dark:border-gray-700 rounded-lg">
                        <div class="flex-1">
                            <div class="font-medium text-gray-900 dark:text-white">${backup}</div>
                            ${timestamp ? `<div class="text-sm text-gray-500 dark:text-gray-400">${timestamp}</div>` : ''}
                        </div>
                        <div class="flex space-x-2">
                            <a href="/backup/download/${backup}" 
                               class="inline-flex items-center px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-md transition duration-200">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                Download
                            </a>
                            <button onclick="deleteBackup('${backup}')" 
                                    class="inline-flex items-center px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md transition duration-200">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            backupsList.innerHTML = backupsHtml;
        } catch (error) {
            console.error('Load backups error:', error);
            backupsList.innerHTML = '<p class="text-red-500">' + translations.failedLoadError + error.message + '</p>';
        }
    }

    function extractTimestamp(filename) {
        // Extract timestamp from filename like "primary_sortingoffice_20250726_143022.sql"
        const match = filename.match(/(\d{8}_\d{6})\.sql$/);
        if (match) {
            const timestamp = match[1];
            const date = new Date(
                timestamp.substring(0, 4) + '-' + 
                timestamp.substring(4, 6) + '-' + 
                timestamp.substring(6, 8) + 'T' +
                timestamp.substring(9, 11) + ':' +
                timestamp.substring(11, 13) + ':' +
                timestamp.substring(13, 15)
            );
            return date.toLocaleString();
        }
        return null;
    }

    // Make deleteBackup function global
    window.deleteBackup = async function(filename) {
        if (!confirm(translations.confirmDelete)) {
            return;
        }

        try {
            const response = await fetch(`/backup/delete/${filename}`, {
                method: 'DELETE',
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                credentials: 'same-origin' // Important for maintaining session cookies
            });

            // Check if response is JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                if (response.redirected || response.status === 302) {
                    alert(translations.sessionExpiredDelete);
                    return;
                }
                alert(translations.failedDelete);
                return;
            }

            const result = await response.json();
            if (result.success) {
                loadBackups(); // Refresh the backups list
            } else {
                alert(translations.failedDeleteError + result.message);
            }
        } catch (error) {
            console.error('Delete backup error:', error);
            alert(translations.failedDeleteError + error.message);
        }
    };
});
</script>
